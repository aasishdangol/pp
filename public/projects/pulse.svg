  <rect x="20" y="156" width="64" height="6" rx="2" fill="#FAF8F3" fill-opacity="0.2"/>

  <!-- stat cards -->
  <g>
    <rect x="142" y="58" width="130" height="64" rx="4" fill="#FAF8F3" fill-opacity="0.06" stroke="#E8A33D" stroke-opacity="0.3"/>
    <rect x="158" y="74" width="50" height="6" rx="2" fill="#FAF8F3" fill-opacity="0.3"/>
    <rect x="158" y="92" width="74" height="14" rx="2" fill="#E8A33D"/>
  </g>
  <g>
    <rect x="285" y="58" width="130" height="64" rx="4" fill="#FAF8F3" fill-opacity="0.06" stroke="#E8A33D" stroke-opacity="0.3"/>
    <rect x="301" y="74" width="50" height="6" rx="2" fill="#FAF8F3" fill-opacity="0.3"/>
    <rect x="301" y="92" width="58" height="14" rx="2" fill="#FAF8F3"/>
  </g>
  <g>
    <rect x="428" y="58" width="130" height="64" rx="4" fill="#FAF8F3" fill-opacity="0.06" stroke="#E8A33D" stroke-opacity="0.3"/>
