  <!-- line chart -->
  <rect x="142" y="140" width="416" height="130" rx="4" fill="#FAF8F3" fill-opacity="0.05" stroke="#FAF8F3" stroke-opacity="0.1"/>
  <polyline points="160,230 210,210 260,235 310,180 360,200 410,150 460,170 510,120 540,140" fill="none" stroke="#E8A33D" stroke-width="2.5"/>
  <polyline points="160,230 210,210 260,235 310,180 360,200 410,150 460,170 510,120 540,140" fill="none" stroke="#E8A33D" stroke-opacity="0.15" stroke-width="40"/>

