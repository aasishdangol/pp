<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#0E1830"/>
  <rect width="600" height="400" fill="url(#grid)"/>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E8A33D" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- browser chrome -->
  <rect x="0" y="0" width="600" height="34" fill="#16223D"/>
  <circle cx="18" cy="17" r="5" fill="#E8746A"/>
  <circle cx="36" cy="17" r="5" fill="#E8A33D"/>
  <circle cx="54" cy="17" r="5" fill="#6FCF97"/>
  <rect x="80" y="10" width="220" height="14" rx="3" fill="#FAF8F3" fill-opacity="0.08"/>

  <!-- sidebar -->
  <rect x="0" y="34" width="120" height="366" fill="#16223D"/>
  <rect x="20" y="58" width="80" height="8" rx="2" fill="#E8A33D"/>
  <rect x="20" y="90" width="64" height="6" rx="2" fill="#FAF8F3" fill-opacity="0.35"/>
  <rect x="20" y="112" width="64" height="6" rx="2" fill="#FAF8F3" fill-opacity="0.2"/>
